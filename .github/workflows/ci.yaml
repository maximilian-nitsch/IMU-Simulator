name: ROS 2 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-22.04
    container:
      image: rostooling/setup-ros-docker:ubuntu-jammy-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: imu_simulator_package
          target-ros2-distro: humble
          vcs-repo-file-url: imu_simulator.repos
